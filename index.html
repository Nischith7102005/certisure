<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiSure | 3D Document Verification</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <style>
        /* === BASE STYLES === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8B5CF6;
            --dark: #0A0A0A;
            --light: #F9FAFB;
            --accent: #EC4899;
        }

        body {
            font-family: 'Inter', sans-serif, system-ui;
            background: var(--dark);
            color: var(--light);
            overflow-x: hidden;
            position: relative;
        }

        /* === 3D CANVAS CONTAINER === */
        #webgl {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* === CONTENT LAYOUT === */
        .section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        /* === MINIMALIST UI === */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .title {
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            letter-spacing: -0.05em;
        }

        .subtitle {
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            max-width: 700px;
            margin: 0 auto 4rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.7);
        }

        /* === NAVIGATION === */
        nav {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary);
            text-decoration: none;
        }

        /* === TECH BACKGROUND IMAGE === */
        .tech-bg {
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(135deg, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="none" stroke="%238B5CF6" stroke-width="0.5" opacity="0.1"/></svg>');
            background-size: 200px;
            opacity: 0.3;
            z-index: -1;
        }

        /* === FLOATING DOCUMENt CARD === */
        .doc-card {
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 24px;
            padding: 3rem;
            max-width: 600px;
            transition: transform 0.4s ease;
        }

        .doc-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
        }

        /* === BUTTONS === */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px -10px var(--primary);
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            nav { left: 1rem; top: 1rem; }
            .title { font-size: 4rem; }
        }
    </style>
</head>
<body>
    <!-- 3D Canvas -->
    <canvas id="webgl"></canvas>

    <!-- Tech Background Pattern -->
    <div class="tech-bg"></div>

    <!-- Navigation -->
    <nav>
        <a href="#" class="logo">CertiSure</a>
    </nav>

    <!-- Hero Section -->
    <section class="section" id="hero">
        <div class="container">
            <h1 class="title">Secure Academic<br>Credentials</h1>
            <p class="subtitle">
                AI-powered verification with blockchain technology for tamper-proof academic documents.
            </p>
            <div class="doc-card">
                <p style="font-size: 1.2rem; margin-bottom: 2rem;">
                    Scan, verify, and trust — all in seconds.
                </p>
                <button class="btn">Get Started</button>
            </div>
        </div>
    </section>

    <!-- Features Section -->
    <section class="section" id="features">
        <div class="container">
            <h2 class="title">Features</h2>
            <p class="subtitle">Next-generation document security</p>
        </div>
    </section>

    <script>
        // === THREE.JS SETUP ===
        let scene, camera, renderer, documentMesh;
        let scrollY = 0;

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x0a0a0a, 1, 15);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.z = 5;

            // Renderer
            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('webgl'),
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0x8B5CF6, 1);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // Create 3D Document
            createDocument();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
            // Scroll events
            window.addEventListener('scroll', handleScroll);
        }

        // === 3D DOCUMENT === 
        function createDocument() {
            // Document Body (minimalist white plane)
            const geometry = new THREE.PlaneGeometry(3, 4, 1, 1);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                roughness: 0.1,
                metalness: 0.0,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide
            });
            documentMesh = new THREE.Mesh(geometry, material);
            
            // Add subtle gradient texture (optional)
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load('https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800', (tex) => {
                tex.repeat.set(1, 1);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                material.map = tex;
                material.needsUpdate = true;
            });

            scene.add(documentMesh);
        }

        // === SCROLL CONTROL === 
        function handleScroll() {
            scrollY = window.scrollY;
        }

        // === ANIMATION === 
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate document based on scroll
            const scrollFactor = scrollY * 0.0002;
            documentMesh.rotation.y = scrollFactor;
            documentMesh.rotation.x = Math.sin(scrollFactor) * 0.1;
            
            // Gentle floating animation
            documentMesh.position.y = Math.sin(Date.now() * 0.001) * 0.1;
            
            renderer.render(scene, camera);
        }

        // === RESIZE HANDLER === 
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // === GSAP SCROLL SMOOTHING === 
        gsap.to({}, 1, {
            repeat: -1,
            onRepeat: () => {
                // Smooth scroll updates
            }
        });
    </script>
</body>
</html>
