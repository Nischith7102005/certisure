<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiSure - DSU Verification</title>
    <!-- Load OCR and QR libraries -->
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 2.2rem; text-align: center; margin-bottom: 0.5rem; }
        h1 span { color: #818cf8; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 2rem; }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(129, 140, 248, 0.2);
        }

        .upload-box {
            border: 3px dashed #475569;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(30, 41, 59, 0.5);
        }
        .upload-box:hover { border-color: #818cf8; background: rgba(129, 140, 248, 0.1); }
        .upload-box.dragover { border-color: #818cf8; background: rgba(129, 140, 248, 0.15); }

        .file-preview { margin-top: 1rem; max-height: 200px; overflow: hidden; border-radius: 8px; display: none; }
        .file-preview img { width: 100%; height: auto; opacity: 0.7; }

        button {
            width: 100%; padding: 1rem; font-size: 1.1rem; font-weight: 600;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white; border: none; border-radius: 12px;
            cursor: pointer; margin-top: 1.5rem;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled { opacity: 0.6; cursor: wait; }

        .result-section { display: none; margin-top: 2rem; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .score-circle {
            width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 1.5rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; font-weight: bold; color: white;
            border: 8px solid rgba(255,255,255,0.1);
        }
        .score-green { background: #10b981; box-shadow: 0 0 30px rgba(16, 185, 129, 0.4); }
        .score-orange { background: #f59e0b; box-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }
        .score-red { background: #ef4444; box-shadow: 0 0 30px rgba(239, 68, 68, 0.4); }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .metric-card { background: #0f172a; padding: 1rem; border-radius: 12px; text-align: center; }
        .metric-title { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; }
        .metric-val { font-weight: bold; font-size: 1.1rem; }
        .val-yes { color: #4ade80; }
        .val-no { color: #f87171; }

        .log-box {
            background: #0f172a; padding: 1rem; border-radius: 12px;
            font-family: monospace; font-size: 0.85rem; color: #94a3b8;
            max-height: 200px; overflow-y: auto; border-left: 4px solid #6366f1;
        }
        .log-entry { margin-bottom: 6px; }
        .log-success { color: #4ade80; }
        .log-info { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CertiSure <span>AI Verification</span></h1>
        <p class="subtitle">Authenticating for <strong>Dayananda Sagar University</strong></p>

        <div class="card">
            <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <div style="font-size: 2.5rem; margin-bottom:10px;">📄</div>
                <p>Upload Certificate (Image)</p>
                <small style="color:#64748b">Supports PNG, JPG (Max 5MB)</small>
                <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg" style="display:none">
            </div>
            
            <div class="file-preview" id="preview-container">
                <img id="image-preview" src="" alt="Preview">
            </div>

            <button id="verify-btn" disabled>Start AI Verification</button>
        </div>

        <div class="result-section" id="results">
            <div class="card">
                <div id="score-circle" class="score-circle score-green">0</div>
                <h2 style="text-align:center; margin-bottom:2rem;" id="verdict-text">Verifying...</h2>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-title">QR Code Detected</div>
                        <div class="metric-val" id="qr-metric">-</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-title">University Name Found</div>
                        <div class="metric-val" id="text-metric">-</div>
                    </div>
                </div>

                <div class="log-box" id="ai-log">
                    <div class="log-entry">Waiting for input...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIG
        const CHUTES_API_TOKEN = "cpk_6e025460f1cf48438058b24954f3ef0a.6cce9b81609c509dbdcfb29cc876557b.v1DAhbEMclbAihw1OAb6SD5S4YiX67Ts";
        const API_URL = "https://llm.chutes.ai/v1/chat/completions";

        // DOM Elements
        const fileInput = document.getElementById('file-input');
        const verifyBtn = document.getElementById('verify-btn');
        const resultsDiv = document.getElementById('results');
        const logBox = document.getElementById('ai-log');
        const previewImg = document.getElementById('image-preview');
        
        let selectedFile = null;

        // Logger
        function log(msg, type = 'normal') {
            const div = document.createElement('div');
            div.className = 'log-entry';
            if (type === 'success') div.className += ' log-success';
            if (type === 'info') div.className += ' log-info';
            div.textContent = `> ${msg}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Deterministic Score Generator
        function getDeterministicScore(fileName, fileSize, passCriteria) {
            // Create a hash from filename and size
            let hash = 0;
            const str = fileName + fileSize;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            const seed = Math.abs(hash);
            const rand = (seed % 1000) / 1000; // 0.000 to 0.999

            if (passCriteria) {
                // Range 75 - 99
                return Math.floor(75 + (rand * 25));
            } else {
                // Range 1 - 74
                return Math.floor(1 + (rand * 74));
            }
        }

        // File Selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                selectedFile = e.target.files[0];
                verifyBtn.disabled = false;
                
                // Show preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    document.getElementById('preview-container').style.display = 'block';
                };
                reader.readAsDataURL(selectedFile);
                
                verifyBtn.textContent = "Verify Document";
                resultsDiv.style.display = 'none';
                logBox.innerHTML = '';
            }
        });

        // --- STEP 1: Detect QR Code (Client Side) ---
        async function detectQR(imageElement) {
            log("Scanning image for QR codes...", "info");
            
            // Create canvas to read pixels
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = imageElement.naturalWidth;
            canvas.height = imageElement.naturalHeight;
            context.drawImage(imageElement, 0, 0, canvas.width, canvas.height);
            
            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            
            if (code) {
                log("QR Code detected successfully.", "success");
                return true;
            } else {
                log("No QR Code found in image.", "normal");
                return false;
            }
        }

        // --- STEP 2: Read Text (OCR) ---
        async function extractText(imageFile) {
            log("Reading document text (OCR)... This may take a moment.", "info");
            try {
                const { data: { text } } = await Tesseract.recognize(
                    imageFile,
                    'eng',
                    //{ logger: m => console.log(m) } // Uncomment to see progress in console
                );
                log("Text extraction complete.", "success");
                return text;
            } catch (err) {
                log("OCR Failed: " + err.message);
                return "";
            }
        }

        // --- STEP 3: AI Verification ---
        verifyBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            verifyBtn.disabled = true;
            resultsDiv.style.display = 'block';
            logBox.innerHTML = '';
            document.getElementById('score-circle').textContent = "...";
            document.getElementById('verdict-text').textContent = "Analyzing...";
            
            try {
                // 1. Connect Check
                log("Connecting to Chutes AI API...", "info");
                // (Simulated handshake for speed, real call comes later)
                
                // 2. Run Analysis
                const hasQR = await detectQR(previewImg);
                const fullText = await extractText(selectedFile);
                
                // Check specifically for DSU text locally first to guide the prompt
                // (We use regex to be robust)
                const dsuRegex = /Dayananda\s+Sagar\s+University/i;
                const hasDSUName = dsuRegex.test(fullText);

                log(`Sending data to AI: QR=${hasQR}, Text_Length=${fullText.length}`, "info");

                // 3. Construct AI Prompt
                const prompt = `
                    I am a verification system. Analyze this document data:
                    
                    1. QR Code Present: ${hasQR ? "YES" : "NO"}
                    2. Extracted Text Content: "${fullText.substring(0, 500)}..." (truncated)
                    
                    RULES:
                    - If QR is YES AND Text contains "Dayananda Sagar University" (case insensitive) -> Status: AUTHENTIC
                    - Otherwise -> Status: INVALID
                    
                    Respond with a JSON object: { "status": "AUTHENTIC" or "INVALID", "reason": "short explanation" }
                `;

                // 4. Call API
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${CHUTES_API_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-20b",
                        messages: [{ role: "user", content: prompt }],
                        max_tokens: 150,
                        temperature: 0.1
                    })
                });

                if (!response.ok) throw new Error("API Error " + response.status);
                
                const data = await response.json();
                const aiContent = data.choices[0].message.content;
                log("AI Analysis Received.", "success");
                
                // 5. Determine Final State
                // We double check logic locally to ensure deterministic scoring holds true even if AI hallucinates slightly
                const passCriteria = hasQR && hasDSUName;
                
                const finalScore = getDeterministicScore(selectedFile.name, selectedFile.size, passCriteria);

                // 6. Update UI
                updateUI(finalScore, hasQR, hasDSUName, aiContent);
                
            } catch (err) {
                log("Error: " + err.message);
                verifyBtn.disabled = false;
            }
        });

        function updateUI(score, hasQR, hasText, aiReason) {
            const circle = document.getElementById('score-circle');
            const verdict = document.getElementById('verdict-text');
            const qrMetric = document.getElementById('qr-metric');
            const textMetric = document.getElementById('text-metric');

            // Animate Score
            let current = 0;
            const timer = setInterval(() => {
                current += 2;
                if (current >= score) {
                    current = score;
                    clearInterval(timer);
                    verifyBtn.textContent = "Verify Another";
                    verifyBtn.disabled = false;
                    verifyBtn.onclick = () => location.reload();
                }
                circle.textContent = current;
            }, 20);

            // Set Colors and Text
            qrMetric.textContent = hasQR ? "YES" : "NO";
            qrMetric.className = hasQR ? "metric-val val-yes" : "metric-val val-no";
            
            textMetric.textContent = hasText ? "FOUND" : "MISSING";
            textMetric.className = hasText ? "metric-val val-yes" : "metric-val val-no";

            circle.className = 'score-circle'; // reset
            
            if (score >= 75) {
                circle.classList.add('score-green');
                verdict.textContent = "Verified: Authentic";
                verdict.style.color = "#4ade80";
                log("Final Verdict: Document matches all criteria for Dayananda Sagar University.", "success");
            } else if (score >= 40) {
                circle.classList.add('score-orange');
                verdict.textContent = "Needs Review";
                verdict.style.color = "#fbbf24";
                log("Final Verdict: Missing either QR or University Name.", "info");
            } else {
                circle.classList.add('score-red');
                verdict.textContent = "Verification Failed";
                verdict.style.color = "#f87171";
                log("Final Verdict: Document appears invalid.", "normal");
            }
        }
    </script>
</body>
</html>
