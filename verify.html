<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiSure - DSU AI Verification</title>
    <!-- QR Code Detection -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <!-- Text OCR -->
    <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 2.3rem; text-align: center; margin-bottom: 0.5rem; }
        h1 span { color: #818cf8; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 2rem; font-size: 1.1rem; }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(129, 140, 248, 0.2);
        }

        .upload-box {
            border: 3px dashed #475569;
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(30, 41, 59, 0.5);
        }
        .upload-box:hover { border-color: #818cf8; background: rgba(129, 140, 248, 0.1); }
        .upload-box.dragover { border-color: #818cf8; background: rgba(129, 140, 248, 0.15); }

        .file-preview { margin-top: 1.5rem; max-height: 250px; overflow: hidden; border-radius: 12px; display: none; }
        .file-preview img { width: 100%; border-radius: 12px; }

        button {
            width: 100%; padding: 1rem; font-size: 1.1rem; font-weight: 600;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white; border: none; border-radius: 12px;
            cursor: pointer; margin-top: 1.5rem;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .result { display: none; margin-top: 2rem; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .score-circle {
            width: 160px; height: 160px; border-radius: 50%; margin: 0 auto 1.5rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.8rem; font-weight: bold; color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        .green { background: linear-gradient(135deg, #10b981, #059669); }
        .orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .red { background: linear-gradient(135deg, #ef4444, #dc2626); }

        .status-badge {
            display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 50px; font-size: 0.95rem; font-weight: 500;
            margin: 1rem 0;
        }
        .connected { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid #10b981; }
        .error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .loading { background: rgba(251, 191, 36, 0.2); color: #fde047; border: 1px solid #f59e0b; }

        .log-box {
            background: #0f172a; padding: 1.2rem; border-radius: 12px; margin-top: 1rem;
            font-family: 'Courier New', monospace; font-size: 0.9rem; color: #94a3b8;
            max-height: 280px; overflow-y: auto; border-left: 4px solid #6366f1;
        }
        .log-entry { margin: 6px 0; }
        .log-success { color: #4ade80; }
        .log-info { color: #60a5fa; }
        .log-error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CertiSure - <span>Dayananda Sagar University</span></h1>
        <p class="subtitle">AI-powered verification with real QR & text analysis</p>

        <div class="card">
            <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <div style="font-size: 3rem; margin-bottom:12px;">Certificate</div>
                <p>Upload certificate image</p>
                <small style="color:#64748b">JPG, PNG • Max 8MB</small>
                <input type="file" id="file-input" accept="image/*" style="display:none">
            </div>

            <div class="file-preview" id="preview">
                <img id="preview-img" src="" alt="Certificate Preview">
            </div>

            <button id="verify-btn" disabled>Start AI Verification</button>
        </div>

        <!-- Result -->
        <div class="result" id="result">
            <div class="card">
                <div style="text-align:center;">
                    <div id="score-circle" class="score-circle green">0</div>
                    <h2 id="verdict">Analyzing Certificate...</h2>
                </div>

                <div id="connection-status" class="status-badge loading">
                    <span>Connecting to AI...</span>
                </div>

                <div class="log-box" id="log">
                    <div class="log-entry">Ready. Upload an image to begin.</div>
                </div>

                <button onclick="location.reload()" style="margin-top:1.5rem; background:#475569;">
                    Verify Another Document
                </button>
            </div>
        </div>
    </div>

    <script>
        // YOUR CHUTES AI
        const API_TOKEN = "cpk_6e025460f1cf48438058b24954f3ef0a.6cce9b81609c509dbdcfb29cc876557b.v1DAhbEMclbAihw1OAb6SD5S4YiX67Ts";
        const API_URL = "https://llm.chutes.ai/v1/chat/completions";

        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('preview-img');
        const verifyBtn = document.getElementById('verify-btn');
        const resultDiv = document.getElementById('result');
        const logDiv = document.getElementById('log');
        const scoreCircle = document.getElementById('score-circle');
        const verdict = document.getElementById('verdict');
        const statusBadge = document.getElementById('connection-status');

        let selectedFile = null;

        function log(msg, type = 'normal') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            if (type === 'success') entry.classList.add('log-success');
            if (type === 'info') entry.classList.add('log-info');
            if (type === 'error') entry.classList.add('log-error');
            entry.textContent = `> ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    previewImg.src = ev.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(selectedFile);
                verifyBtn.disabled = false;
                log("Image loaded. Ready for verification.", "info");
            }
        });

        verifyBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            verifyBtn.disabled = true;
            resultDiv.style.display = 'block';
            logDiv.innerHTML = '';
            scoreCircle.textContent = "...";
            verdict.textContent = "Processing...";
            statusBadge.className = 'status-badge loading';
            statusBadge.innerHTML = '<span>Step 1: Detecting QR Code...</span>';

            try {
                // Step 1: Load image into canvas for QR detection
                const img = new Image();
                img.src = previewImg.src;
                await new Promise(r => img.onload = r);

                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                // Step 2: Detect QR Code
                const qrCode = jsQR(imageData.data, imageData.width, imageData.height);
                const hasQR = !!qrCode;
                log(hasQR ? "QR Code found!" : "No QR Code detected.", hasQR ? "success" : "normal");

                // Step 3: Extract text using OCR
                statusBadge.innerHTML = '<span>Step 2: Reading text from image...</span>';
                log("Running OCR (this may take 5–15 seconds)...", "info");
                const { data: { text } } = await Tesseract.recognize(selectedFile, 'eng');
                log("Text extraction complete.", "success");

                // Step 4: Send everything to AI
                statusBadge.innerHTML = '<span>Step 3: Asking AI to verify...</span>';
                log("Sending QR status + extracted text to AI...", "info");

                const prompt = `
You are an official verifier for Dayananda Sagar University certificates.

Document Analysis:
- QR Code Present: ${hasQR ? "YES" : "NO"}
- Extracted Text (first 1000 chars): "${text.substring(0, 1000)}${text.length > 1000 ? '...' : ''}"

Task:
1. Check if the text contains "Dayananda Sagar University" or "DSU" in official context.
2. If QR is present AND university name is clearly mentioned → Score: 75–99 (genuine)
3. If only one is present → Score: 40–74 (suspicious)
4. If neither → Score: 1–39 (fake)

Respond exactly in this format:
SCORE: XX
STATUS: GENUINE / SUSPICIOUS / FAKE
REASON: [short explanation in 1-2 sentences]
                `.trim();

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-20b",
                        messages: [{ role: "user", content: prompt }],
                        max_tokens: 200,
                        temperature: 0.2
                    })
                });

                if (!response.ok) throw new Error("AI unreachable");

                const data = await response.json();
                const aiResponse = data.choices[0]?.message?.content || "No response";

                // Parse AI result
                const scoreMatch = aiResponse.match(/SCORE:\s*(\d+)/i);
                const statusMatch = aiResponse.match(/STATUS:\s*(GENUINE|SUSPICIOUS|FAKE)/i);
                const reasonMatch = aiResponse.match(/REASON:\s*(.+)/i);

                const score = scoreMatch ? parseInt(scoreMatch[1]) : 50;
                const status = statusMatch ? statusMatch[1].toUpperCase() : "UNKNOWN";
                const reason = reasonMatch ? reasonMatch[1] : "No reason provided";

                // Final UI Update
                statusBadge.className = 'status-badge connected';
                statusBadge.innerHTML = '<span>AI Verification Complete</span>';

                // Animate score
                let current = 0;
                const timer = setInterval(() => {
                    current += 3;
                    if (current >= score) {
                        current = score;
                        clearInterval(timer);
                    }
                    scoreCircle.textContent = current;
                }, 30);

                // Set colors
                if (score >= 75) {
                    scoreCircle.className = 'score-circle green';
                    verdict.textContent = "GENUINE CERTIFICATE";
                    verdict.style.color = "#4ade80";
                } else if (score >= 40) {
                    scoreCircle.className = 'score-circle orange';
                    verdict.textContent = "SUSPICIOUS – Manual Review Needed";
                    verdict.style.color = "#fbbf24";
                } else {
                    scoreCircle.className = 'score-circle red';
                    verdict.textContent = "FAKE / INVALID";
                    verdict.style.color = "#f87171";
                }

                log(`AI Score: ${score}/100 | Status: ${status}`, "success");
                log(`AI Reason: ${reason}`, "info");

            } catch (err) {
                statusBadge.className = 'status-badge error';
                statusBadge.innerHTML = '<span>AI Connection Failed</span>';
                log(`Error: ${err.message}`, "error");
                verdict.textContent = "Verification Failed";
                scoreCircle.textContent = "X";
                scoreCircle.className = 'score-circle red';
            }
        });
    </script>
</body>
</html>
