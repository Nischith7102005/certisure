<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiSure - DSU PDF Verification</title>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- QR Detection -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <!-- OCR -->
    <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 2.4rem; text-align: center; margin-bottom: 0.5rem; }
        h1 span { color: #818cf8; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 2.5rem; font-size: 1.1rem; }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(129, 140, 248, 0.2);
        }

        .upload-box {
            border: 3px dashed #475569;
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(30, 41, 59, 0.5);
        }
        .upload-box:hover { border-color: #818cf8; background: rgba(129, 140, 248, 0.1); }
        .upload-box.dragover { border-color: #818cf8; background: rgba(129, 140, 248, 0.15); }

        button {
            width: 100%; padding: 1rem; font-size: 1.1rem; font-weight: 600;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white; border: none; border-radius: 12px;
            cursor: pointer; margin-top: 1.5rem;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .result { display: none; margin-top: 2rem; }
        .score-circle {
            width: 160px; height: 160px; border-radius: 50%; margin: 0 auto 1.5rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.8rem; font-weight: bold; color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        .green { background: linear-gradient(135deg, #10b981, #059669); }
        .orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .red { background: linear-gradient(135deg, #ef4444, #dc2626); }

        .status-badge {
            display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 50px; font-size: 0.95rem; font-weight: 500;
            margin: 1rem 0;
        }
        .connected { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid #10b981; }
        .error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .loading { background: rgba(251, 191, 36, 0.2); color: #fde047; border: 1px solid #f59e0b; }

        .log-box {
            background: #0f172a; padding: 1.2rem; border-radius: 12px; margin-top: 1rem;
            font-family: 'Courier New', monospace; font-size: 0.9rem; color: #94a3b8;
            max-height: 300px; overflow-y: auto; border-left: 4px solid #6366f1;
        }
        .log-entry { margin: 6px 0; }
        .log-success { color: #4ade80; }
        .log-info { color: #60a5fa; }
        .log-error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CertiSure - <span>DSU PDF Verification</span></h1>
        <p class="subtitle">Upload your certificate (PDF or Image) - AI scans every page for QR code and Dayananda Sagar University</p>

        <div class="card">
            <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <div style="font-size: 3rem; margin-bottom:12px;">PDF</div>
                <p>Click or drop your certificate here</p>
                <small style="color:#64748b">PDF, PNG, JPG • Max 10MB</small>
                <input type="file" id="file-input" accept=".pdf,image/*" style="display:none">
            </div>

            <button id="verify-btn" disabled>Start AI Verification</button>
        </div>

        <div class="result" id="result">
            <div class="card">
                <div style="text-align:center;">
                    <div id="score-circle" class="score-circle green">0</div>
                    <h2 id="verdict">Processing PDF...</h2>
                </div>

                <div id="connection-status" class="status-badge loading">
                    <span>Initializing...</span>
                </div>

                <div class="log-box" id="log">
                    <div class="log-entry">Upload a PDF or image to begin verification.</div>
                </div>

                <button onclick="location.reload()" style="margin-top:1.5rem; background:#475569;">
                    Verify Another Document
                </button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const API_TOKEN = "cpk_6e025460f1cf48438058b24954f3ef0a.6cce9b81609c509dbdcfb29cc876557b.v1DAhbEMclbAihw1OAb6SD5S4YiX67Ts";
        const API_URL = "https://llm.chutes.ai/v1/chat/completions";

        const fileInput = document.getElementById('file-input');
        const verifyBtn = document.getElementById('verify-btn');
        const resultDiv = document.getElementById('result');
        const logDiv = document.getElementById('log');
        const scoreCircle = document.getElementById('score-circle');
        const verdict = document.getElementById('verdict');
        const statusBadge = document.getElementById('connection-status');

        let selectedFile = null;

        function log(msg, type = 'normal') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            if (type === 'success') entry.classList.add('log-success');
            if (type === 'info') entry.classList.add('log-info');
            if (type === 'error') entry.classList.add('log-error');
            entry.textContent = `> ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                verifyBtn.disabled = false;
                log(`File loaded: ${selectedFile.name} (${(selectedFile.size/1024/1024).toFixed(2)} MB)`, "info");
            }
        });

        // Process PDF or Image
        async function processDocument(file) {
            const isPDF = file.type === 'application/pdf';
            let pagesData = [];

            if (isPDF) {
                log("Loading PDF with pdf.js...", "info");
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                log(`PDF has ${pdf.numPages} page(s). Scanning each page...`, "info");

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport }).promise;
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);

                    // QR Detection
                    const qrCode = jsQR(imageData.data, imageData.width, imageData.height);
                    const hasQR = !!qrCode;

                    // OCR
                    const { data: { text } } = await Tesseract.recognize(canvas.toDataURL(), 'eng');

                    pagesData.push({ page: i, hasQR, text: text.substring(0, 1500) });

                    log(`Page ${i}: QR=${hasQR ? 'YES' : 'NO'}, Text length=${text.length}`, hasQR ? "success" : "normal");
                }
            } else {
                // Handle image
                const img = new Image();
                img.src = URL.createObjectURL(file);
                await new Promise(r => img.onload = r);

                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                const qrCode = jsQR(imageData.data, imageData.width, imageData.height);
                const hasQR = !!qrCode;

                const { data: { text } } = await Tesseract.recognize(file, 'eng');

                pagesData.push({ page: 1, hasQR, text: text.substring(0, 2000) });
                log(`Image: QR=${hasQR ? 'YES' : 'NO'}, Text length=${text.length}`, hasQR ? "success" : "normal");
            }

            return pagesData;
        }

        verifyBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            verifyBtn.disabled = true;
            resultDiv.style.display = 'block';
            logDiv.innerHTML = '';
            scoreCircle.textContent = "...";
            verdict.textContent = "Processing document...";
            statusBadge.className = 'status-badge loading';
            statusBadge.innerHTML = '<span>Analyzing PDF pages...</span>';

            try {
                const pagesData = await processDocument(selectedFile);

                // Check for QR and DSU name
                const hasQR = pagesData.some(p => p.hasQR);
                const allText = pagesData.map(p => p.text).join("\n");
                const hasDSU = /dayananda\s+sagar\s+university|dsu/i.test(allText);

                statusBadge.innerHTML = '<span>Sending to AI for final scoring...</span>';
                log("Sending document analysis to Chutes AI...", "info");

                const prompt = `
You are verifying a Dayananda Sagar University certificate (PDF/Image).

Analysis from scanner:
- QR Code found on any page: ${hasQR ? "YES" : "NO"}
- "Dayananda Sagar University" mentioned: ${hasDSU ? "YES" : "NO"}
- Total pages scanned: ${pagesData.length}
- Sample text: "${allText.substring(0, 800)}..."

Scoring Rules:
- If QR present AND university name found → Score 75–99 (GENUINE)
- If only one present → Score 40–74 (SUSPICIOUS)
- If neither → Score 1–39 (FAKE)

Respond exactly:
SCORE: XX
STATUS: GENUINE / SUSPICIOUS / FAKE
REASON: [1-2 sentences]
                `;

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-20b",
                        messages: [{ role: "user", content: prompt }],
                        max_tokens: 200,
                        temperature: 0.2
                    })
                });

                if (!response.ok) throw new Error("AI failed");

                const data = await response.json();
                const aiResponse = data.choices[0]?.message?.content || "";

                const scoreMatch = aiResponse.match(/SCORE:\s*(\d+)/i);
                const statusMatch = aiResponse.match(/STATUS:\s*(GENUINE|SUSPICIOUS|FAKE)/i);
                const score = scoreMatch ? parseInt(scoreMatch[1]) : 50;
                const status = statusMatch ? statusMatch[1].toUpperCase() : "UNKNOWN";

                // Animate score
                let current = 0;
                const timer = setInterval(() => {
                    current += 3;
                    if (current >= score) {
                        current = score;
                        clearInterval(timer);
                    }
                    scoreCircle.textContent = current;
                }, 30);

                // Final UI
                statusBadge.className = 'status-badge connected';
                statusBadge.innerHTML = '<span>AI Verification Complete</span>';

                if (score >= 75) {
                    scoreCircle.className = 'score-circle green';
                    verdict.textContent = "GENUINE CERTIFICATE";
                    verdict.style.color = "#4ade80";
                } else if (score >= 40) {
                    scoreCircle.className = 'score-circle orange';
                    verdict.textContent = "SUSPICIOUS – Manual Review Needed";
                    verdict.style.color = "#fbbf24";
                } else {
                    scoreCircle.className = 'score-circle red';
                    verdict.textContent = "FAKE / INVALID CERTIFICATE";
                    verdict.style.color = "#f87171";
                }

                log(`AI Final Score: ${score}/100 | Status: ${status}`, "success");
                log(`Reason: ${aiResponse.split('REASON:')[1]?.trim() || "N/A"}`, "info");

            } catch (err) {
                statusBadge.className = 'status-badge error';
                statusBadge.innerHTML = '<span>Verification Failed</span>';
                log(`Error: ${err.message}`, "error");
                verdict.textContent = "Verification Failed";
                scoreCircle.textContent = "X";
                scoreCircle.className = 'score-circle red';
            }
        });
    </script>
</body>
</html>
