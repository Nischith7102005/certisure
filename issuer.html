<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issuer Portal - CertiSure</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <!-- Add QR Code library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <!-- Add AWS Amplify Storage -->
    <script src="https://cdn.jsdelivr.net/npm/aws-amplify@4.3.27/dist/aws-amplify.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            color: #e2e8f0;
        }
        .dashboard-bg {
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.15) 0%, transparent 40%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .btn-primary {
            background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.15) 0%, rgba(124, 58, 237, 0.15) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .upload-area {
            border: 2px dashed rgba(99, 102, 241, 0.5);
            transition: all 0.3s ease;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #818cf8;
            background: rgba(79, 70, 229, 0.1);
        }
        .progress-bar {
            height: 8px;
            background: rgba(79, 70, 229, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 4px;
            width: 0%;
            transition: width 0.5s ease;
        }
        .document-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        #qr-code {
            display: none;
            margin: 20px auto;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }
        #uploaded-file {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navigation -->
    <nav class="bg-gray-900 bg-opacity-90 backdrop-blur-sm fixed w-full z-50" data-aos="fade-down">
        <!-- ... (same navigation as before) ... -->
    </nav>

    <!-- Dashboard Header -->
    <header class="dashboard-bg pt-24 pb-12">
        <!-- ... (same header as before) ... -->
    </header>

    <!-- Main Content -->
    <main class="py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left Column - Document Upload -->
                <div class="lg:col-span-2">
                    <div class="bg-gray-800 rounded-xl shadow-lg p-6" data-aos="fade-up">
                        <h2 class="text-xl font-bold text-white mb-6">Issue New Document</h2>
                        
                        <form id="documentForm">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <!-- Document Details -->
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Document Type</label>
                                    <select id="docType" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                                        <option value="">Select document type</option>
                                        <option value="degree">Degree Certificate</option>
                                        <option value="transcript">Transcript</option>
                                        <option value="recommendation">Recommendation Letter</option>
                                        <option value="professional">Professional Certificate</option>
                                    </select>
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Student ID</label>
                                    <input id="studentId" type="text" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter student ID" required>
                                </div>
                                
                                <div class="md:col-span-2">
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Student Name</label>
                                    <input id="studentName" type="text" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter student full name" required>
                                </div>
                                
                                <div class="md:col-span-2">
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Document</label>
                                    <div class="upload-area rounded-lg p-8 text-center cursor-pointer" id="document-upload">
                                        <i data-feather="file" class="mx-auto h-12 w-12 text-gray-400"></i>
                                        <p class="mt-2 text-sm text-gray-400">Click to upload document</p>
                                        <p class="text-xs text-gray-500">PDF, DOC up to 10MB</p>
                                        <input type="file" id="fileInput" class="hidden" accept=".pdf,.doc,.docx">
                                    </div>
                                    <div id="fileInfo" class="mt-2 text-sm text-gray-400 hidden">
                                        Selected file: <span id="fileName" class="font-medium"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- QR Code Preview -->
                            <div id="qr-code" class="mt-6"></div>
                            
                            <div class="mt-8">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-sm font-medium text-gray-300">Processing</span>
                                    <span class="text-sm font-medium text-gray-300" id="progressText">0%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" id="progress-fill"></div>
                                </div>
                            </div>
                            
                            <div class="mt-8 flex justify-end">
                                <button type="submit" id="submitBtn" class="btn-primary px-6 py-3 rounded-lg font-medium">
                                    Issue Document
                                </button>
                            </div>
                        </form>
                    </div>
                    
                    <!-- Recent Documents -->
                    <!-- ... (same as before) ... -->
                </div>
                
                <!-- Right Column - Activity Feed -->
                <!-- ... (same as before) ... -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 py-8 mt-12">
        <!-- ... (same as before) ... -->
    </footer>

    <script>
        // Initialize AOS and Feather Icons
        AOS.init({
            duration: 1000,
            once: true
        });
        
        feather.replace();

        // AWS Configuration
        // Replace these with your actual AWS credentials and S3 bucket information
        const awsConfig = {
            region: 'YOUR_AWS_REGION',
            credentials: {
                accessKeyId: 'YOUR_ACCESS_KEY_ID',
                secretAccessKey: 'YOUR_SECRET_ACCESS_KEY'
            },
            bucket: 'YOUR_S3_BUCKET_NAME'
        };

        // Configure AWS
        AWS.config.update({
            region: awsConfig.region,
            credentials: new AWS.Credentials(
                awsConfig.credentials.accessKeyId,
                awsConfig.credentials.secretAccessKey
            )
        });

        const s3 = new AWS.S3();

        // File handling
        const fileInput = document.getElementById('fileInput');
        const documentUpload = document.getElementById('document-upload');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const qrCodeElement = document.getElementById('qr-code');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progressText');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('documentForm');

        let selectedFile = null;
        let qrCodeData = null;

        // Handle file selection
        documentUpload.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileName.textContent = selectedFile.name;
                fileInfo.classList.remove('hidden');
                
                // Generate a unique identifier for this document
                const docId = 'doc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                
                // Generate QR code data
                qrCodeData = JSON.stringify({
                    documentId: docId,
                    studentId: document.getElementById('studentId').value,
                    studentName: document.getElementById('studentName').value,
                    documentType: document.getElementById('docType').value,
                    timestamp: new Date().toISOString()
                });
                
                // Generate QR code
                QRCode.toCanvas(qrCodeElement, qrCodeData, {
                    width: 200,
                    margin: 1,
                    color: {
                        dark: '#000000',
                        light: '#ffffff'
                    }
                }, (error) => {
                    if (error) console.error(error);
                    qrCodeElement.style.display = 'block';
                });
            }
        });

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!selectedFile) {
                alert('Please select a file to upload');
                return;
            }
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Uploading...';
            
            try {
                // Generate a unique filename
                const timestamp = Date.now();
                const fileExtension = selectedFile.name.split('.').pop();
                const fileName = `documents/${timestamp}.${fileExtension}`;
                const qrFileName = `qr-codes/${timestamp}.png`;
                
                // Upload the document to S3
                await uploadFileToS3(selectedFile, fileName, 'document');
                
                // Convert QR code canvas to blob and upload
                const qrCanvas = qrCodeElement.querySelector('canvas');
                qrCanvas.toBlob(async (blob) => {
                    await uploadFileToS3(blob, qrFileName, 'QR code');
                    
                    // Show success message
                    alert('Document and QR code uploaded successfully!');
                    resetForm();
                    
                }, 'image/png');
                
            } catch (error) {
                console.error('Upload failed:', error);
                alert('Upload failed. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Issue Document';
            }
        });

        // Function to upload file to S3
        function uploadFileToS3(file, fileName, type) {
            return new Promise((resolve, reject) => {
                const params = {
                    Bucket: awsConfig.bucket,
                    Key: fileName,
                    Body: file,
                    ContentType: file.type
                };
                
                const options = {
                    partSize: 10 * 1024 * 1024, // 10MB chunks
                    queueSize: 1
                };
                
                const upload = s3.upload(params, options);
                
                upload.on('httpUploadProgress', (progress) => {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    updateProgress(percent);
                });
                
                upload.send((err, data) => {
                    if (err) {
                        reject(err);
                    } else {
                        console.log(`${type} uploaded successfully:`, data.Location);
                        resolve(data);
                    }
                });
            });
        }

        // Update progress bar
        function updateProgress(percent) {
            progressFill.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
        }

        // Reset form after successful upload
        function resetForm() {
            form.reset();
            selectedFile = null;
            fileInfo.classList.add('hidden');
            qrCodeElement.style.display = 'none';
            qrCodeElement.innerHTML = '';
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Issue Document';
        }

        // Initialize drag and drop
        documentUpload.addEventListener('dragover', (e) => {
            e.preventDefault();
            documentUpload.classList.add('dragover');
        });

        documentUpload.addEventListener('dragleave', () => {
            documentUpload.classList.remove('dragover');
        });

        documentUpload.addEventListener('drop', (e) => {
            e.preventDefault();
            documentUpload.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                const event = new Event('change', { bubbles: true });
                fileInput.dispatchEvent(event);
            }
        });
    </script>
</body>
</html>
